<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Medical Status</title><link rel="stylesheet" href="style.css"></head>
<body>
<main id="medical-status" class="medical-status" aria-live="polite">
  <div class="status-mark"><span></span></div>
  <div class="status-copy"><div class="eyebrow">EMS RESPONSE SYSTEM</div><h1 id="title">Critical condition</h1><p id="message">Stay calm. Medical assistance has been alerted.</p></div>
  <div class="timer-wrap"><div id="timer" class="timer">00:00</div><div class="timer-label">RESPONSE WINDOW</div></div>
  <div id="hint" class="hint"><kbd>E</kbd><span>Hold to respawn</span></div>
</main>
<script src="app.js"></script>
</body>
</html>
